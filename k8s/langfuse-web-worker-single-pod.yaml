apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web-worker
  labels:
    app: langfuse-web-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web-worker
  template:
    metadata:
      labels:
        app: langfuse-web-worker
    spec:
      containers:
        - name: langfuse-web
          image: <ECR_REGISTRY>/<ORG>/<REPO>:<WEB_IMAGE_TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-web
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20

        - name: langfuse-worker
          image: <ECR_REGISTRY>/<ORG>/<REPO>:<WORKER_IMAGE_TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3030
              name: http-worker
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 3030
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3030
            initialDelaySeconds: 40
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  labels:
    app: langfuse-web-worker
spec:
  selector:
    app: langfuse-web-worker
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP